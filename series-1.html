<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>超人系列 - 外鲸人图鉴</title>
  <style>
    body { font-family: 'PingFang SC', sans-serif; background-color: #f4f7f6; color: #333; text-align: center; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    h1 { color: #0056b3; margin-bottom: 5px; }
    p.desc { color: #666; margin-bottom: 30px; }
    
    /* 返回按钮样式 */
    .back-btn { display: inline-block; padding: 10px 20px; background-color: #eee; color: #333; text-decoration: none; border-radius: 50px; margin-bottom: 20px; transition: 0.3s; font-weight: bold;}
    .back-btn:hover { background-color: #ddd; transform: translateX(-5px); }
    
    /* 图鉴画廊：自动适应手机和电脑，图片自动排列 */
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    .gallery img { width: 100%; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: transform 0.3s; border: 1px solid #eee;}
    /* 鼠标放上去图片会稍微放大的高级特效 */
    .gallery img:hover { transform: scale(1.03); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
  </style>
</head>
<body>

  <div class="container">
    <div style="text-align: left;">
      <a href="./index.html" class="back-btn">⬅️ 返回首页</a>
    </div>
    
    <h1>🦸‍♂️ 超人系列</h1>
    <p class="desc">外鲸人宇宙首批超级英雄化身</p>
    
    <div class="gallery">
      <img src="./s1-1.jpg" alt="超人系列藏品">
      <img src="./s1-2.jpg" alt="超人系列藏品">
      <img src="./s1-3.jpg" alt="超人系列藏品">
      <img src="./s1-4.jpg" alt="超人系列藏品">
      <img src="./s1-5.jpg" alt="超人系列藏品">
      <img src="./s1-6.jpg" alt="超人系列藏品">
      <img src="./s1-7.jpg" alt="超人系列藏品">
      <img src="./s1-8.jpg" alt="超人系列藏品">
      <img src="./s1-9.jpg" alt="超人系列藏品">
      <img src="./s1-10.jpg" alt="超人系列藏品">
      
      </div>
    </div>

</body>
</html>
